name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate repository contracts
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_REF" && "$BASE_REF" != "0000000000000000000000000000000000000000" ]]; then
            python3 scripts/validate-repository.py --base-ref "$BASE_REF"
          else
            python3 scripts/validate-repository.py
          fi
          python3 scripts/validate-repository.py --self-test
      - name: Check Python and shell syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/mc-agent-kit-pycache
        run: |
          python3 -m compileall -q scripts skills plugins
          find scripts plugins skills -type f -name '*.sh' -exec bash -n {} +
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Check patch whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_REF" && "$BASE_REF" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_REF"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
